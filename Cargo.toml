[package]
name = "docker_container_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
bytes = "1.10.1"
chrono = "0.4.41"
clap = { version = "4.5.38", features = ["derive"] }
colored = "3.0.0"
env_logger = "0.11.8"
futures-util = "0.3.31"
http-body-util = "0.1.3"
humansize = "2.1.3"
hyper = { version = "1.6.0", features = ["http1", "http2"] }
hyper-util = { version = "0.1.12", features = ["client-legacy", "tokio"] }
hyperlocal = "0.9.1"
log = "0.4.27"
prettytable-rs = "0.10.0"
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
url = "2.5.4"
urlencoding = "2.1.3"
